<body>

  <div>
    <img id="i" src="" alt="Random Dog">
    <button onclick="generateimg()">Get Dog</button>
  </div>

  <script>
    const api_url = "https://cataas.com/cat?json=true";

    async function generateimg() {
      try {
        // 1. Fetch raw response
        const response = await fetch(api_url);
        
        // 2. Parse JSON
        const result = await response.json();
        
        // 3. Update img src with the message URL
        document.getElementById("i").src = result.message;
      } catch (error) {
        console.error("Failed to load image:", error);
      }
    }

    // Load an image on start
    generateimg();
  </script>

</body>
