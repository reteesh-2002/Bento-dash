<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Display</title>
 
</head>
<body>

    <div class="weather-card">
        <h2>Chennai Weather</h2>
        <!-- This is where the temperature will appear -->
        <div id="temp-value">Loading...</div>
    </div>

    <script>
        // The URL you provided
        const apiUrl = 'https://api.open-meteo.com/v1/forecast?latitude=13.0878&longitude=80.2785&current=temperature_2m';

        async function fetchTemperature() {
            try {
                // 1. Fetch data from the API
                const response = await fetch(apiUrl);
                
                // 2. Check if the request was successful
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                
                // 3. Parse the JSON response
                const data = await response.json();
                
                // 4. Extract the temperature and the unit (e.g., °C) from the JSON
                const temperature = data.current.temperature_2m;
                const unit = data.current_units.temperature_2m;
                
                // 5. Display the result in the HTML element
                document.getElementById('temp-value').textContent = `${temperature}${unit}`;
                
            } catch (error) {
                console.error('Error fetching the weather data:', error);
                document.getElementById('temp-value').textContent = 'Error loading data';
            }
        }

        // Run the function when the page loads
        fetchTemperature();
    </script>

</body>
</html>
